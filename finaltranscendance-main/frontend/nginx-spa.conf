# CLAUDE-MODIF (2026-10-07) — NOUVEAU fichier : sert le build React avec fallback SPA (/terms, /privacy-policy, /satisfaction/...).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: /terms, /privacy-policy, /satisfaction/<token>... are
    # handled client-side by App.tsx.
    location / {
        try_files $uri /index.html;
    }
}
