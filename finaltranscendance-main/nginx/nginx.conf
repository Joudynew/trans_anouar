# CLAUDE-MODIF (2026-10-07) — MODIFIÉ : blocs server déplacés dans templates/default.conf.template, server_tokens off.
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # Serveurs générés depuis /etc/nginx/templates/default.conf.template
    # (envsubst de l'image officielle nginx, remplace ${HTTPS_PORT}).
    include /etc/nginx/conf.d/*.conf;
}
